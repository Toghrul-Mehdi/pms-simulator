<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMS-1 Simulyator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#5d6878;--line:#dfe3e8;--pri:#1f5fbf;--ok:#1e8a4c;--bad:#c23a3a;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--ink:#e6eaf0;--mut:#9aa5b4;--line:#2c3440;--pri:#6aa3ff;--ok:#4cc985;--bad:#ff7676;--warn:#e0b34f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:10px 0}
nav b{margin-right:auto;font-size:18px}
nav button{background:none;border:0;color:var(--mut);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}
h1{font-size:24px;margin:20px 0 4px}h2{font-size:19px;margin:0 0 10px}
.mut{color:var(--mut)}.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
ul{padding-left:20px}li{margin:4px 0}
.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt input{margin-right:8px}.opt.sel{border-color:var(--pri)}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
input[type=text],select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;max-width:320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:7px 0;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:14px}
.grid .ans{background:color-mix(in srgb,var(--pri) 18%,transparent)}.grid .cur{outline:2px solid var(--pri)}.grid .flag{border-color:var(--warn);border-width:2px}
.grid .g{background:color-mix(in srgb,var(--ok) 25%,transparent)}.grid .b{background:color-mix(in srgb,var(--bad) 25%,transparent)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}.low{color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.expl{border-left:3px solid var(--pri);padding:6px 10px;margin-top:10px;background:var(--bg)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.big{font-size:40px;font-weight:700}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
a{color:var(--pri);word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<b>PMS-1 · MHBS</b>
<button data-v="home">Əsas</button><button data-v="mat">Materiallar</button><button data-v="prac">Məşq</button><button data-v="exam">Sınaq imtahanı</button>
</nav></div></header>
<main class="wrap" id="app"></main>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const api = (u, b) => fetch(u, b ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) } : {}).then(r => r.json());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = 'ABCDE';
let M, CFG, exam = null, tick = null;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };

function go(v) {
  if (exam && v !== 'exam' && !confirm('İmtahan davam edir. Çıxmaq istəyirsiniz? Cavablar itəcək.')) return;
  if (v !== 'exam') { exam = null; clearInterval(tick); }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ({ home, mat, prac, exam: examHome })[v](); scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));

function home() {
  const r = M.research, hist = store.get('pms_hist', []);
  app.innerHTML = `<h1>PMS I mərhələ hazırlığı</h1><p class="mut">Sertifikat növü: <b>${esc(CFG.certificate)}</b> · Bankda ${CFG.counts.closed} qapalı + ${CFG.counts.open} açıq tapşırıq</p>
  <div class="card"><h2>${esc(r.title)}</h2><ul>${r.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>
  <div class="card"><h2>İmtahan formatı</h2><ul>${r.format.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
  <div class="row"><button class="btn" onclick="go('exam')">Sınaq imtahanına başla</button><button class="btn sec" onclick="go('mat')">Materiallara bax</button></div></div>
  <div class="card"><h2>10 günlük plan</h2><table>${M.plan.map(d => `<tr><td><b>Gün ${d.day}</b></td><td>${esc(d.task)}</td></tr>`).join('')}</table></div>
  ${hist.length ? `<div class="card"><h2>Nəticələriniz</h2><table><tr><th>Tarix</th><th>Rejim</th><th>Bal</th><th></th></tr>${hist.slice(-10).reverse().map(h => `<tr><td>${new Date(h.t).toLocaleString('az')}</td><td>${h.mode}</td><td>${h.score}/${h.max} (${h.pct}%)</td><td>${h.pass ? '✅' : '❌'}</td></tr>`).join('')}</table></div>` : ''}
  <div class="card"><h2>Mənbələr</h2><ul>${r.sources.map(s => `<li><a href="${s}" target="_blank" rel="noopener">${s}</a></li>`).join('')}</ul>
  <p class="mut">Rəsmi qaydalar (bal bölgüsü, keçid balı, tarix) hər il dəyişə bilər — qeydiyyat səhifəsində və DİM-in "İştirakçının yaddaşı" sənədində yoxlayın.</p></div>`;
}

function mat() {
  app.innerHTML = `<h1>Metodik materiallar</h1><p class="mut">Tam MHBS (IFRS) — "Maliyyə hesabatları" sertifikat növü üçün.</p>` +
    M.sections.map((s, i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(s.title)}</summary><ul>${s.body.map(b => `<li>${b}</li>`).join('')}</ul></details>`).join('');
}

async function prac() {
  const topics = await api('/api/topics');
  app.innerHTML = `<h1>Mövzu üzrə məşq</h1><div class="card"><div class="row"><select id="tp"><option value="">Bütün mövzular</option>${topics.map(t => `<option>${esc(t)}</option>`).join('')}</select><button class="btn" id="st">Başla</button></div><p class="mut">Hər cavabdan sonra izah göstərilir.</p></div><div id="pq"></div>`;
  $('#st').onclick = async () => {
    const list = await api('/api/practice?topic=' + encodeURIComponent($('#tp').value));
    let i = 0, ok = 0;
    const show = () => {
      if (i >= list.length) { $('#pq').innerHTML = `<div class="card"><h2>Bitdi: ${ok}/${list.length}</h2></div>`; return; }
      const q = list[i];
      $('#pq').innerHTML = `<div class="card"><div class="row"><span class="tag">${i + 1}/${list.length}</span><span class="tag">${esc(q.topic)}</span><span class="tag">${q.type === 'open' ? 'Açıq' : 'Qapalı'}</span><span class="mut">Düz: ${ok}</span></div>
      <p><b>${esc(q.text)}</b></p>${q.type === 'closed' ? q.options.map((o, k) => `<label class="opt" data-k="${k}"><input type="radio" name="p" value="${k}">${L[k]}) ${esc(o)}</label>`).join('') : `<input type="text" id="pa" inputmode="decimal" placeholder="Cavab (${q.unit})">`}
      <div class="row" style="margin-top:12px"><button class="btn" id="chk">Yoxla</button></div><div id="fb"></div></div>`;
      $('#chk').onclick = () => {
        let good;
        if (q.type === 'closed') {
          const s = document.querySelector('input[name=p]:checked'); if (!s) return;
          good = +s.value === q.answer;
          document.querySelectorAll('.opt').forEach(o => { const k = +o.dataset.k; if (k === q.answer) o.classList.add('good'); else if (k === +s.value) o.classList.add('wrong'); });
        } else {
          const v = Number($('#pa').value.replace(/\s/g, '').replace(',', '.')); good = Math.abs(v - q.answer) <= q.tolerance;
        }
        if (good) ok++;
        $('#fb').innerHTML = `<div class="expl"><b style="color:var(${good ? '--ok' : '--bad'})">${good ? 'Düzdür' : 'Səhvdir'}</b> — düzgün cavab: ${q.type === 'closed' ? L[q.answer] : q.answer.toLocaleString('az')}<br>${esc(q.explanation)}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">Növbəti</button></div>`;
        $('#chk').disabled = true; $('#nx').onclick = () => { i++; show(); };
      };
    };
    show();
  };
}

function examHome() {
  if (exam) return renderQ();
  app.innerHTML = `<h1>Sınaq imtahanı (DİM üslubu)</h1>
  <div class="card"><h2>Tam imtahan</h2><p>${CFG.closedCount} qapalı + ${CFG.openCount} açıq tapşırıq · ${CFG.minutes} dəqiqə · qapalı ${CFG.closedPoints} bal, açıq ${CFG.openPoints} bal · keçid ${CFG.passPercent}%</p>
  <p class="mut">Elektron imtahanda olduğu kimi: suallar arasında sərbəst keçid, "sonra bax" işarəsi, qalan vaxt. Səhvə görə bal çıxılmır. Kalkulyator hazır saxlayın.</p>
  <button class="btn" onclick="startExam('full')">Başla</button></div>
  <div class="card"><h2>Mini sınaq</h2><p>10 qapalı + 3 açıq · 30 dəqiqə</p><button class="btn sec" onclick="startExam('mini')">Başla</button></div>`;
}

async function startExam(mode) {
  const d = await api('/api/exam/start', { mode });
  exam = { ...d, mode, i: 0, ans: {}, flag: {}, end: Date.now() + d.minutes * 60000 };
  clearInterval(tick); tick = setInterval(() => { const t = $('#tm'); if (!t) return; const s = Math.max(0, Math.round((exam.end - Date.now()) / 1000)); t.textContent = fmt(s); t.classList.toggle('low', s < 600); if (s === 0) submit(true); }, 1000);
  renderQ();
}
const fmt = s => `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function renderQ() {
  const q = exam.questions[exam.i], N = exam.questions.length, a = exam.ans[q.id];
  const done = Object.keys(exam.ans).filter(k => exam.ans[k] !== '').length;
  app.innerHTML = `<div class="card row" style="justify-content:space-between"><span>Cavablandırılıb: <b>${done}/${N}</b></span><span>Qalan vaxt: <span class="timer" id="tm">${fmt(Math.round((exam.end - Date.now()) / 1000))}</span></span><button class="btn" onclick="submit()">İmtahanı bitir</button></div>
  <div class="card"><div class="row"><span class="tag">Tapşırıq ${exam.i + 1}</span><span class="tag">${q.type === 'open' ? 'Açıq tip' : 'Qapalı tip'}</span></div>
  <p><b>${esc(q.text)}</b></p>
  ${q.type === 'closed' ? q.options.map((o, k) => `<label class="opt ${a === k ? 'sel' : ''}"><input type="radio" name="q" value="${k}" ${a === k ? 'checked' : ''}>${L[k]}) ${esc(o)}</label>`).join('') : `<input type="text" id="oa" inputmode="decimal" placeholder="Cavabı rəqəmlə yazın (${q.unit})" value="${a ?? ''}">`}
  <div class="row" style="margin-top:14px"><button class="btn sec" id="pv" ${exam.i === 0 ? 'disabled' : ''}>← Əvvəlki</button><button class="btn sec" id="fl">${exam.flag[q.id] ? '★ İşarəni sil' : '☆ Sonra bax'}</button><button class="btn" id="nx" ${exam.i === N - 1 ? 'disabled' : ''}>Növbəti →</button></div></div>
  <div class="card"><div class="grid">${exam.questions.map((x, k) => `<button data-k="${k}" class="${exam.ans[x.id] !== undefined && exam.ans[x.id] !== '' ? 'ans' : ''} ${k === exam.i ? 'cur' : ''} ${exam.flag[x.id] ? 'flag' : ''}">${k + 1}</button>`).join('')}</div></div>`;
  document.querySelectorAll('input[name=q]').forEach(r => r.onchange = () => { exam.ans[q.id] = +r.value; renderQ(); });
  const oa = $('#oa'); if (oa) oa.oninput = () => { exam.ans[q.id] = oa.value.trim(); };
  $('#pv').onclick = () => { exam.i--; renderQ(); }; $('#nx').onclick = () => { exam.i++; renderQ(); };
  $('#fl').onclick = () => { exam.flag[q.id] = !exam.flag[q.id]; renderQ(); };
  document.querySelectorAll('.grid button').forEach(b => b.onclick = () => { exam.i = +b.dataset.k; renderQ(); });
}

async function submit(auto) {
  if (!exam) return;
  const left = exam.questions.length - Object.values(exam.ans).filter(v => v !== '').length;
  if (!auto && !confirm(left ? `${left} sual cavabsızdır. Bitirmək istəyirsiniz?` : 'İmtahanı bitirmək istəyirsiniz?')) return;
  clearInterval(tick);
  const r = await api('/api/exam/submit', { examId: exam.examId, answers: exam.ans });
  const mode = exam.mode; exam = null;
  if (r.error) { app.innerHTML = `<div class="card">${esc(r.error)}</div>`; return; }
  const h = store.get('pms_hist', []); h.push({ t: Date.now(), mode: mode === 'mini' ? 'Mini' : 'Tam', score: r.score, max: r.max, pct: r.percent, pass: r.passed }); store.set('pms_hist', h);
  app.innerHTML = `<h1>Nəticə</h1><div class="card"><div class="big" style="color:var(${r.passed ? '--ok' : '--bad'})">${r.score} / ${r.max}</div>
  <p>${r.percent}% · ${r.passed ? 'Keçid həddini keçdiniz ✅' : `Keçid həddi ${r.passPercent}% — keçmədiniz ❌`} · Sərf olunan vaxt: ${fmt(r.elapsedSec)}</p>
  <div class="row"><button class="btn" onclick="go('exam')">Yeni sınaq</button><button class="btn sec" onclick="go('prac')">Zəif mövzular üzrə məşq</button></div></div>
  <div class="card"><h2>Mövzular üzrə</h2><table>${Object.entries(r.byTopic).sort((a, b) => a[1].correct / a[1].total - b[1].correct / b[1].total).map(([t, v]) => `<tr><td>${esc(t)}</td><td>${v.correct}/${v.total}</td></tr>`).join('')}</table></div>
  <h2>Cavabların təhlili</h2>${r.details.map((d, k) => `<div class="card"><div class="row"><span class="tag">${k + 1}</span><span class="tag">${esc(d.topic)}</span><b style="color:var(${d.correct ? '--ok' : '--bad'})">${d.correct ? '+' + d.points : '0'} bal</b></div><p>${esc(d.text)}</p>
  ${d.type === 'closed' ? d.options.map((o, i) => `<div class="opt ${i === d.answer ? 'good' : i === d.given ? 'wrong' : ''}">${L[i]}) ${esc(o)}</div>`).join('') : `<p>Sizin cavab: <b>${esc(d.given ?? '—')}</b> · Düzgün: <b>${d.answer.toLocaleString('az')}</b></p>`}
  <div class="expl">${esc(d.explanation)}</div></div>`).join('')}`;
  scrollTo(0, 0);
}

Promise.all([api('/api/materials'), api('/api/config')]).then(([m, c]) => { M = m; CFG = c; go('home'); });
</script>
</body>
</html>
